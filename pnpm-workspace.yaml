autoInstallPeers: false
dedupePeerDependents: true
engineStrict: true
saveExact: true

packages:
  - packages/*

catalog:
  "@changesets/cli": 3.0.1
  "@commitlint/cli": 21.2.1
  "@commitlint/config-conventional": 21.2.0
  lefthook: 2.1.10
  oxfmt: 0.58.0
  oxlint: 1.73.0
  typedoc: 0.28.20
  typedoc-plugin-markdown: 4.12.0

allowBuilds:
  lefthook: true

overrides:
  # GHSA-qw65-cvwx-89v3, GHSA-58mr-gqgx-xq4g and GHSA-hrr3-gc8f-f4qj,
  # plus earlier parser advisories: keep one security floor for commitlint's
  # transitive URI parser. 3.1.8 published 2026-09-15, past the 7-day cutoff.
  "fast-uri@<3.1.8": "3.1.8"
  # oxfmt pins 2.1.0. These worker-option fixes address GHSA-5gmw-xhrv-c9v3
  # and GHSA-85c8-ppgw-ccpr without upgrading the formatter. 2.1.2 published
  # 2026-08-23, past the 7-day cutoff; its Node floor is compatible with oxfmt.
  "tinypool@<2.1.2": "2.1.2"
  # GHSA-2883-xcg3-v3hh (High): js-yaml maxTotalMergeKeys does not limit CPU use
  # for empty merge sources, below 4.3.2. Transitive only (via @commitlint/cli >
  # cosmiconfig); dev-tooling only. 4.3.2 published 2026-08-26, past the 7-day
  # cutoff.
  "js-yaml@4": "4.3.2"

# Supply-chain maturity delay: mirror the consumer repos. Don't adopt a freshly
# published version until it has been on the registry for 7 days (10080 minutes).
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
